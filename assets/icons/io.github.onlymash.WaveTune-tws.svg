<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Base Plate Drop Shadow (GNOME HIG) -->
    <filter id="shadow" x="-12%" y="-6%" width="124%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#010604" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Emerald Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Plate Gradient -->
    <linearGradient id="plate-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2c25" />
      <stop offset="45%" stop-color="#121d18" />
      <stop offset="100%" stop-color="#090f0c" />
    </linearGradient>

    <!-- Ambient Emerald Radial Light -->
    <radialGradient id="plate-glow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00a862" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00a862" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Rim (GNOME HIG) -->
    <linearGradient id="plate-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Earbud Outline Stroke Gradient -->
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Acoustic Soundwave Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffb2" />
      <stop offset="50%" stop-color="#00dc82" />
      <stop offset="100%" stop-color="#00c8f8" />
    </linearGradient>

    <clipPath id="plate-clip">
      <rect x="12" y="10" width="104" height="104" rx="26" />
    </clipPath>
  </defs>

  <!-- Base Plate with Shadow -->
  <rect x="12" y="10" width="104" height="104" rx="26" fill="url(#plate-bg)" filter="url(#shadow)" />

  <g clip-path="url(#plate-clip)">
    <rect x="12" y="10" width="104" height="104" rx="26" fill="url(#plate-bg)" />
    <rect x="12" y="10" width="104" height="104" rx="26" fill="url(#plate-glow)" />

    <!-- Center Acoustic Soundwaves (radiating upwards and between earbuds) -->
    <g filter="url(#glow)">
      <path d="M 50 36 C 54 32, 60 30, 64 30 C 68 30, 74 32, 78 36"
            fill="none" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" />
      <path d="M 44 26 C 50 21, 57 18, 64 18 C 71 18, 78 21, 84 26"
            fill="none" stroke="url(#wave-grad)" stroke-width="3" stroke-linecap="round" />
      <path d="M 37 16 C 45 10, 54 7, 64 7 C 74 7, 83 10, 91 16"
            fill="none" stroke="url(#wave-grad)" stroke-width="2.6" stroke-linecap="round" opacity="0.8" />
      <!-- Central audio frequency bars -->
      <line x1="58" y1="52" x2="58" y2="60" stroke="#00ffb2" stroke-width="2.4" stroke-linecap="round" />
      <line x1="64" y1="48" x2="64" y2="64" stroke="#00f5a0" stroke-width="2.6" stroke-linecap="round" />
      <line x1="70" y1="52" x2="70" y2="60" stroke="#00dc82" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <!-- Left Earbud (Angled ~8 deg, facing inward) -->
    <g transform="translate(40, 62) rotate(-8)">
      <path d="M -6 -24 
               C 2 -24, 8 -18, 8 -10
               C 14 -8, 16 -3, 14 3
               C 12 7, 7 8, 4 6
               L 4 25
               C 4 29, 0 33, -4 33
               C -8 33, -12 29, -12 25
               L -12 6
               C -15 3, -16 -2, -16 -10
               C -16 -18, -12 -24, -6 -24 Z"
            fill="#ffffff" fill-opacity="0.08" />

      <path d="M -6 -24 
               C 2 -24, 8 -18, 8 -10
               C 14 -8, 16 -3, 14 3
               C 12 7, 7 8, 4 6
               L 4 25
               C 4 29, 0 33, -4 33
               C -8 33, -12 29, -12 25
               L -12 6
               C -15 3, -16 -2, -16 -10
               C -16 -18, -12 -24, -6 -24 Z"
            fill="none" stroke="url(#stroke-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

      <path d="M 5 -6 C 8 -3, 8 1, 5 4"
            fill="none" stroke="#00f5a0" stroke-width="2" stroke-linecap="round" opacity="0.9" />

      <line x1="-4" y1="8" x2="-4" y2="20" stroke="#00ffb2" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <!-- Right Earbud (Mirrored, facing inward) -->
    <g transform="translate(88, 62) rotate(8) scale(-1, 1)">
      <path d="M -6 -24 
               C 2 -24, 8 -18, 8 -10
               C 14 -8, 16 -3, 14 3
               C 12 7, 7 8, 4 6
               L 4 25
               C 4 29, 0 33, -4 33
               C -8 33, -12 29, -12 25
               L -12 6
               C -15 3, -16 -2, -16 -10
               C -16 -18, -12 -24, -6 -24 Z"
            fill="#ffffff" fill-opacity="0.08" />

      <path d="M -6 -24 
               C 2 -24, 8 -18, 8 -10
               C 14 -8, 16 -3, 14 3
               C 12 7, 7 8, 4 6
               L 4 25
               C 4 29, 0 33, -4 33
               C -8 33, -12 29, -12 25
               L -12 6
               C -15 3, -16 -2, -16 -10
               C -16 -18, -12 -24, -6 -24 Z"
            fill="none" stroke="url(#stroke-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

      <path d="M 5 -6 C 8 -3, 8 1, 5 4"
            fill="none" stroke="#00f5a0" stroke-width="2" stroke-linecap="round" opacity="0.9" />

      <line x1="-4" y1="8" x2="-4" y2="20" stroke="#00ffb2" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <!-- Bottom Status LED Badge -->
    <g transform="translate(56, 93)">
      <rect x="0" y="0" width="16" height="8" rx="4" fill="#000000" opacity="0.4" />
      <circle cx="8" cy="4" r="2.8" fill="#00ffb2" opacity="0.25" />
      <circle cx="8" cy="4" r="1.6" fill="#00f5a0" />
      <circle cx="7.4" cy="3.4" r="0.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Top Specular Bevel Rim (GNOME HIG) -->
  <rect x="12.5" y="10.5" width="103" height="103" rx="25.5" fill="none" stroke="url(#plate-rim)" stroke-width="1" />
</svg>
