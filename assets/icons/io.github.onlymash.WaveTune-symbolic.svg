<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Headband Arch -->
    <path d="M 4 8 C 4 5 5.8 3 8 3 C 10.2 3 12 5 12 8" stroke-width="1.3" />
    
    <!-- Left Ear Cup -->
    <rect x="2.5" y="7" width="2.5" height="4.8" rx="1.2" stroke-width="1.2" fill="currentColor" fill-opacity="0.2" />
    
    <!-- Right Ear Cup -->
    <rect x="11" y="7" width="2.5" height="4.8" rx="1.2" stroke-width="1.2" fill="currentColor" fill-opacity="0.2" />
    
    <!-- Equalizer Waves in Center -->
    <line x1="6.8" y1="8" x2="6.8" y2="10.5" stroke-width="1" />
    <line x1="8" y1="7" x2="8" y2="11.5" stroke-width="1.2" />
    <line x1="9.2" y1="8" x2="9.2" y2="10.5" stroke-width="1" />
  </g>
</svg>
